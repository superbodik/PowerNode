org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# rtmp_broadcaster pulls in a transitive dependency still on the old
# com.android.support library, which otherwise conflicts with androidx.core
# at manifest-merge time. Jetifier rewrites it to the AndroidX equivalent
# instead of leaving both present.
android.enableJetifier=true
